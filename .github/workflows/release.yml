name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify and test release tag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out tagged revision
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify tag matches package version
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          expected_tag="v${package_version}"

          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${expected_tag}." >&2
            exit 1
          fi

          notes_file="release/RELEASE_NOTES_${GITHUB_REF_NAME}.md"
          if [[ ! -f "${notes_file}" ]]; then
            echo "Missing curated release notes: ${notes_file}." >&2
            exit 1
          fi

      - name: Check release manifest
        run: npm run release:check

      - name: Run tests
        run: npm test

      - name: Test official skills CLI compatibility
        run: npm run test:skills-cli

  release:
    name: Create GitHub release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out tagged revision
        uses: actions/checkout@v7

      - name: Create release from existing tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists." >&2
            exit 1
          fi

          notes_file="release/RELEASE_NOTES_${TAG}.md"
          if [[ ! -f "${notes_file}" ]]; then
            echo "Missing curated release notes: ${notes_file}." >&2
            exit 1
          fi

          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "${TAG}" \
            --notes-file "${notes_file}"
